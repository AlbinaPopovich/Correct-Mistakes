<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find the mistake! — We had a concert</title>

  <style>
    :root {
      --dark: #203858;
      --blue: #3979c6;
      --green: #218653;
      --green-light: #e2f6e9;
      --red: #c74343;
      --red-light: #ffe8e8;
      --yellow: #ffdc78;
      --border: #dce5f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background: linear-gradient(135deg, #eef6ff, #fff9eb);
      color: var(--dark);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(32px, 5vw, 52px);
    }

    .subtitle {
      margin: 0;
      color: #63738a;
      font-size: 18px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(260px, 0.8fr) minmax(400px, 1.2fr);
      gap: 24px;
      align-items: start;
    }

    .picture-card,
    .game-card,
    .start-card,
    .finish-card {
      border: 1px solid var(--border);
      border-radius: 22px;
      background: white;
      box-shadow: 0 12px 32px rgba(32, 56, 88, 0.11);
    }

    .picture-card {
      padding: 10px;
    }

    .picture-card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
    }

    .game-card {
      min-height: 430px;
      padding: clamp(22px, 4vw, 38px);
    }

    .progress-track {
      height: 9px;
      margin-bottom: 34px;
      overflow: hidden;
      border-radius: 20px;
      background: #e7edf5;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: 20px;
      background: var(--blue);
      transition: width 0.3s ease;
    }

    .instruction {
      margin: 0 0 20px;
      color: #526782;
      font-size: 17px;
      line-height: 1.5;
    }

    .sentence {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      min-height: 90px;
      margin-bottom: 26px;
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 700;
      line-height: 1.5;
    }

    .word {
      padding: 3px 5px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--dark);
      font: inherit;
      cursor: pointer;
    }

    .word:hover:not(:disabled) {
      background: #eaf3ff;
    }

    .word:focus-visible,
    .choice:focus-visible,
    .action:focus-visible {
      outline: 3px solid #80b8ff;
      outline-offset: 3px;
    }

    .word.correct {
      background: var(--green-light);
      color: var(--green);
    }

    .word.incorrect {
      background: var(--red-light);
      color: var(--red);
    }

    .word:disabled {
      cursor: default;
    }

    .answer-area {
      min-height: 145px;
    }

    .answer-title {
      margin: 0 0 13px;
      font-size: 17px;
      font-weight: 700;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .choice {
      min-height: 52px;
      padding: 10px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--dark);
      font: inherit;
      font-size: 18px;
      cursor: pointer;
    }

    .choice:hover:not(:disabled) {
      border-color: var(--blue);
    }

    .choice.selected {
      border-color: var(--blue);
      background: #eaf3ff;
    }

    .choice.correct {
      border-color: var(--green);
      background: var(--green-light);
    }

    .choice.incorrect {
      border-color: var(--red);
      background: var(--red-light);
    }

    .choice:disabled {
      cursor: default;
    }

    .feedback {
      min-height: 28px;
      margin: 18px 0 0;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.45;
    }

    .feedback.good {
      color: var(--green);
    }

    .feedback.bad {
      color: var(--red);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .action {
      min-height: 46px;
      padding: 11px 20px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .action:hover {
      filter: brightness(0.96);
    }

    .primary {
      background: var(--blue);
      color: white;
    }

    .secondary {
      background: #edf1f6;
      color: var(--dark);
    }

    .next {
      background: var(--yellow);
      color: #503d05;
    }

    .exit {
      margin-left: auto;
      background: transparent;
      color: #65758b;
    }

    .start-card,
    .finish-card {
      max-width: 650px;
      margin: 50px auto 0;
      padding: 40px 28px;
      text-align: center;
    }

    .start-card h2,
    .finish-card h2 {
      margin-top: 0;
      font-size: 30px;
    }

    .start-card p,
    .finish-card p {
      font-size: 18px;
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 800px) {
      body {
        padding: 14px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .picture-card {
        max-width: 520px;
        margin: 0 auto;
      }

      .game-card {
        min-height: 0;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="page-header">
      <h1>Find the mistake!</h1>
      <p class="subtitle">We had a concert · Past Simple</p>
    </header>

    <div class="layout" id="gameScreen">
      <aside class="picture-card">
        <img src="./1.png" alt="Children performing at a school concert">
      </aside>

      <section class="game-card" aria-label="Find the mistake game">
        <div
          class="progress-track"
          role="progressbar"
          aria-label="Game progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          id="progressTrack"
        >
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <p class="instruction">
          Read the sentence. Tap the word with a mistake.
          Then choose the correct word.
        </p>

        <div class="sentence" id="sentence" aria-label="Sentence"></div>

        <div class="answer-area" id="answerArea" hidden>
          <p class="answer-title">Choose the correct word:</p>
          <div class="choices" id="choices"></div>
        </div>

        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>

        <div class="actions">
          <button class="action primary" id="checkButton" type="button" hidden>
            Check
          </button>

          <button class="action secondary" id="retryButton" type="button" hidden>
            Try again
          </button>

          <button class="action next" id="nextButton" type="button" hidden>
            Next
          </button>

          <button class="action next" id="finishButton" type="button" hidden>
            Finish
          </button>

          <button class="action exit" id="exitButton" type="button">
            Exit game
          </button>
        </div>
      </section>
    </div>

    <section class="start-card" id="startScreen" hidden>
      <h2>Find the mistake!</h2>
      <p>Tap the incorrect word and choose the correct one.</p>
      <button class="action primary" id="startButton" type="button">
        Start game
      </button>
    </section>

    <section class="finish-card" id="finishScreen" hidden>
      <h2>Well done! 🎉</h2>
      <p>You found and corrected all the mistakes.</p>
      <button class="action primary" id="playAgainButton" type="button">
        Play again
      </button>
    </section>
  </main>

  <script>
    const tasks = [
      {
        sentence: "Yesterday our school have a concert.",
        wrongWordIndex: 3,
        correctWord: "had",
        options: ["has", "had", "have", "having"]
      },
      {
        sentence: "The concert were in the school hall.",
        wrongWordIndex: 2,
        correctWord: "was",
        options: ["were", "are", "was", "is"]
      },
      {
        sentence: "My parents didn’t had tickets.",
        wrongWordIndex: 3,
        correctWord: "have",
        options: ["has", "had", "having", "have"]
      },
      {
        sentence: "The children didn’t clapped after the song.",
        wrongWordIndex: 3,
        correctWord: "clap",
        options: ["clapped", "claps", "clap", "clapping"]
      },
      {
        sentence: "The singers was happy.",
        wrongWordIndex: 2,
        correctWord: "were",
        options: ["was", "were", "is", "be"]
      }
    ];

    let taskIndex = 0;
    let selectedOption = null;
    let currentState = "find-word";

    const gameScreen = document.getElementById("gameScreen");
    const startScreen = document.getElementById("startScreen");
    const finishScreen = document.getElementById("finishScreen");

    const sentenceBox = document.getElementById("sentence");
    const answerArea = document.getElementById("answerArea");
    const choicesBox = document.getElementById("choices");
    const feedback = document.getElementById("feedback");

    const progressFill = document.getElementById("progressFill");
    const progressTrack = document.getElementById("progressTrack");

    const checkButton = document.getElementById("checkButton");
    const retryButton = document.getElementById("retryButton");
    const nextButton = document.getElementById("nextButton");
    const finishButton = document.getElementById("finishButton");

    function updateProgress(completedTasks) {
      const percent = (completedTasks / tasks.length) * 100;
      progressFill.style.width = percent + "%";
      progressTrack.setAttribute("aria-valuenow", percent);
    }

    function showFeedback(message, type) {
      feedback.textContent = message;
      feedback.className = "feedback " + type;
    }

    function clearFeedback() {
      feedback.textContent = "";
      feedback.className = "feedback";
    }

    function showTask() {
      const task = tasks[taskIndex];

      selectedOption = null;
      currentState = "find-word";

      sentenceBox.innerHTML = "";
      choicesBox.innerHTML = "";
      answerArea.hidden = true;

      checkButton.hidden = true;
      retryButton.hidden = true;
      nextButton.hidden = true;
      finishButton.hidden = true;

      clearFeedback();
      updateProgress(taskIndex);

      task.sentence.split(" ").forEach((word, index) => {
        const wordButton = document.createElement("button");
        wordButton.type = "button";
        wordButton.className = "word";
        wordButton.textContent = word;
        wordButton.setAttribute(
          "aria-label",
          "Select word: " + word
        );

        wordButton.addEventListener("click", () => {
          selectWord(wordButton, index);
        });

        sentenceBox.appendChild(wordButton);
      });
    }

    function selectWord(button, index) {
      if (currentState !== "find-word") return;

      sentenceBox.querySelectorAll(".word").forEach(wordButton => {
        wordButton.classList.remove("correct", "incorrect");
      });

      if (index !== tasks[taskIndex].wrongWordIndex) {
        button.classList.add("incorrect");
        showFeedback("Not this word. Try another one!", "bad");
        return;
      }

      button.classList.add("correct");
      currentState = "choose-word";
      showFeedback("Yes! Now choose the correct word.", "good");
      showOptions();
    }

    function showOptions() {
      const task = tasks[taskIndex];

      answerArea.hidden = false;
      checkButton.hidden = false;

      task.options.forEach(option => {
        const optionButton = document.createElement("button");
        optionButton.type = "button";
        optionButton.className = "choice";
        optionButton.textContent = option;
        optionButton.setAttribute("aria-pressed", "false");

        optionButton.addEventListener("click", () => {
          if (currentState !== "choose-word") return;

          selectedOption = option;

          choicesBox.querySelectorAll(".choice").forEach(choice => {
            choice.classList.remove("selected");
            choice.setAttribute("aria-pressed", "false");
          });

          optionButton.classList.add("selected");
          optionButton.setAttribute("aria-pressed", "true");
        });

        choicesBox.appendChild(optionButton);
      });
    }

    function checkAnswer() {
      if (currentState !== "choose-word") return;

      if (!selectedOption) {
        showFeedback("Choose a word first.", "bad");
        return;
      }

      const task = tasks[taskIndex];
      const choiceButtons = choicesBox.querySelectorAll(".choice");

      if (selectedOption !== task.correctWord) {
        currentState = "wrong-answer";

        choiceButtons.forEach(button => {
          button.disabled = true;

          if (button.textContent === selectedOption) {
            button.classList.add("incorrect");
          }
        });

        checkButton.hidden = true;
        retryButton.hidden = false;
        showFeedback("Not quite. Try again!", "bad");
        return;
      }

      currentState = "correct-answer";

      choiceButtons.forEach(button => {
        button.disabled = true;

        if (button.textContent === task.correctWord) {
          button.classList.add("correct");
        }
      });

      const wordButtons = sentenceBox.querySelectorAll(".word");
      const correctedWord = wordButtons[task.wrongWordIndex];
      const punctuation = correctedWord.textContent.match(/[.,!?]+$/)?.[0] || "";

      correctedWord.textContent = task.correctWord + punctuation;

      wordButtons.forEach(button => {
        button.disabled = true;
      });

      checkButton.hidden = true;

      if (taskIndex === tasks.length - 1) {
        finishButton.hidden = false;
      } else {
        nextButton.hidden = false;
      }

      showFeedback("Correct! You fixed the sentence.", "good");
    }

    function tryAgain() {
      selectedOption = null;
      currentState = "choose-word";

      choicesBox.querySelectorAll(".choice").forEach(button => {
        button.disabled = false;
        button.classList.remove("selected", "incorrect");
        button.setAttribute("aria-pressed", "false");
      });

      retryButton.hidden = true;
      checkButton.hidden = false;
      clearFeedback();
    }

    function startGame() {
      taskIndex = 0;
      startScreen.hidden = true;
      finishScreen.hidden = true;
      gameScreen.hidden = false;
      showTask();
    }

    function exitGame() {
      const shouldExit = window.confirm(
        "Exit the game? Your progress will be lost."
      );

      if (!shouldExit) return;

      gameScreen.hidden = true;
      finishScreen.hidden = true;
      startScreen.hidden = false;
    }

    function finishGame() {
      updateProgress(tasks.length);
      gameScreen.hidden = true;
      finishScreen.hidden = false;
    }

    checkButton.addEventListener("click", checkAnswer);
    retryButton.addEventListener("click", tryAgain);

    nextButton.addEventListener("click", () => {
      taskIndex++;
      showTask();
    });

    finishButton.addEventListener("click", finishGame);

    document.getElementById("exitButton")
      .addEventListener("click", exitGame);

    document.getElementById("startButton")
      .addEventListener("click", startGame);

    document.getElementById("playAgainButton")
      .addEventListener("click", startGame);

    showTask();
  </script>
</body>
</html>
